plugins {
    id 'com.android.application'
}

android {
    namespace 'com.thuy.dichngaviet'
    compileSdk 35

    defaultConfig {
        applicationId 'com.thuy.dichngaviet'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Ký bằng khóa debug để APK cài được ngay, không cần tạo keystore
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Dịch offline Nga <-> Việt (mô hình tải 1 lần ~30 MB/ngôn ngữ)
    implementation 'com.google.mlkit:translate:17.0.3'
    // Nhận dạng giọng nói offline (Vosk)
    implementation 'net.java.dev.jna:jna:5.18.1@aar'
    implementation 'com.alphacephei:vosk-android:0.3.75@aar'
}
